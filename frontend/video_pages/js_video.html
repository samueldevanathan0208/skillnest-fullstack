<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Course</title>

    <!-- YouTube API (Required for tracking) -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <link rel="stylesheet" href="../css/chatbot.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            max-width: 1400px;
            margin: 20px auto;
            gap: 20px;
            padding: 0 20px;
        }

        .video-section {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .video-player {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-title {
            font-size: 24px;
            margin: 20px 0 10px 0;
            font-weight: 700;
        }

        .video-info {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .btn-container {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .nav-btn {
            padding: 12px 24px;
            background: #4900c1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .nav-btn:hover {
            background: #37009b;
        }

        .nav-btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        .playlist-section {
            width: 350px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: 500px;
            display: flex;
            flex-direction: column;
        }

        .playlist-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
            color: #111827;
            flex-shrink: 0;
        }

        .video-list {
            flex: 1;
            overflow-y: auto;
            /* Custom Scrollbar for better look */
            scrollbar-width: thin;
            scrollbar-color: #4900c1 #f3f4f6;
        }

        .video-item {
            display: flex;
            gap: 12px;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .video-item:hover {
            background: #f9fafb;
        }

        .video-item.active {
            background: #eef2ff;
            border-color: #4900c1;
        }

        .video-item.locked {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }

        .lock-icon {
            font-size: 18px;
            color: #9ca3af;
            display: flex;
            align-items: center;
        }

        .video-thumb {
            width: 120px;
            height: 68px;
            background: #e5e7eb;
            border-radius: 4px;
            object-fit: cover;
        }

        .item-content {
            flex: 1;
            min-width: 0;
            /* for text truncate if needed */
        }

        .item-title {
            font-size: 14px;
            font-weight: 500;
            color: #111827;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-duration {
            color: #6b7280;
            font-size: 12px;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background-color: #f3f4f6;
            color: #4b5563;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .back-home:hover {
            background-color: #e5e7eb;
            color: #1f2937;
        }

        /* --- Responsive Design --- */
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
                padding: 15px;
                margin: 0 auto;
            }

            .playlist-section {
                width: 100%;
                max-height: 400px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            .video-list {
                max-height: 300px;
                /* shorter on mobile */
            }

            .video-section {
                padding: 15px;
            }
        }

        @media (max-width: 768px) {
            .video-title {
                font-size: 20px;
            }

            .btn-container {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="../css/chatbot.css">
    <script src="../js/api.js?v=4"></script>
    <script src="../js/chatbot.js" defer></script>
    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "../pages/login.html";
        }
    </script>
</head>

<body>

    <div class="container">
        <div class="video-section">
            <a href="../pages/dashboard.html" class="back-home">
                ← Back to Dashboard
            </a>
            <div class="video-player">
                <div id="ytVideo" style="width: 100%; height: 100%;"></div>
            </div>

            <h2 class="video-title" id="videoTitle">Loading...</h2>
            <p class="video-info" id="videoInfo">Duration: --:--</p>

            <div class="btn-container">
                <button class="nav-btn" id="prevBtn" onclick="goPrev()">Previous</button>
                <button class="nav-btn" id="nextBtn" onclick="goNext()" disabled>Next</button>
            </div>
        </div>

        <div class="right-column" style="width: 350px; display: flex; flex-direction: column; gap: 20px;">
            <div class="playlist-section" style="width: 100%;">
                <div class="playlist-header">Course Videos</div>
                <div class="video-list" id="videoList"></div>
            </div>

            <div class="notes-section"
                style="background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <div class="notes-header"
                    style="font-size: 18px; font-weight: 700; margin-bottom: 12px; color: #111827;">
                    My Notes <span id="save-status"
                        style="font-size: 12px; color: #6b7280; font-weight: normal;"></span>
                </div>
                <textarea id="notesTextarea"
                    style="width: 100%; height: 150px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; resize: none; margin-bottom: 12px; font-family: inherit;"
                    placeholder="Write your notes for this specific course content..."></textarea>
                <button onclick="saveNotes()"
                    style="width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Save
                    Notes</button>
            </div>
        </div>
    </div>

    <script>
        const videos = COURSES_DATA.js;

        let currentIndex = 0;
        const courseId = 'js';
        let courseProgressData = [];

        /* ===============================
           YOUTUBE TRACKING
        ================================= */

        let player;
        let isApiReady = false;
        let totalDuration = 0;
        let requiredWatchTime = 0;
        let maxWatchedTime = 0;
        let watchInterval = null;
        let heartbeatInterval = null;
        let hasResumed = false;

        function onYouTubeIframeAPIReady() {
            isApiReady = true;
            console.log("YouTube API Ready");
        }

        async function fetchProgress() {
            try {
                const data = await apiFetch("/progress/course");
                return data[courseId] || [];
            } catch (error) {
                console.error('Error fetching progress:', error);
                return [];
            }
        }

        async function fetchVideoState(videoIndex) {
            try {
                return await apiFetch(`/progress/${courseId}/${videoIndex}`);
            } catch (e) {
                console.error("Fetch state failed", e);
                return null;
            }
        }

        async function loadVideos() {
            const list = document.getElementById('videoList');
            list.innerHTML = '';
            courseProgressData = await fetchProgress();

            videos.forEach((video, index) => {
                const isCompleted = courseProgressData.includes(index);
                const isUnlocked = index === 0 || isCompleted || courseProgressData.includes(index - 1);

                const item = document.createElement('div');
                item.className = `video-item ${index === currentIndex ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`;

                if (isUnlocked) {
                    item.onclick = () => { playVideo(index); };
                }

                item.innerHTML = `
                    <img src="${video.thumbnail}" class="video-thumb">
                    <div class="item-content">
                        <div class="item-title">${video.title} ${isCompleted ? '✅' : ''}</div>
                        <div class="item-duration">${video.duration}</div>
                    </div>
                    ${!isUnlocked ? '<div class="lock-icon">🔒</div>' : ''}
                `;
                list.appendChild(item);
            });
        }

        async function playVideo(index) {

            currentIndex = index;
            const video = videos[index];

            document.getElementById("videoTitle").textContent = video.title;
            document.getElementById("videoInfo").textContent = "Duration: " + video.duration;

            const nextBtn = document.getElementById("nextBtn");
            const isCompleted = courseProgressData.includes(index);
            nextBtn.disabled = !isCompleted;

            const videoId = video.src.split("/embed/")[1];

            // Reset state for new video
            maxWatchedTime = 0;
            totalDuration = 0;
            requiredWatchTime = 0;
            hasResumed = false;

            // Fetch saved progress for resume
            const savedState = await fetchVideoState(index);
            if (savedState && savedState.last_watched_time > 0) {
                maxWatchedTime = savedState.last_watched_time;
                console.log(`Resuming at ${maxWatchedTime}s`);
            }

            // Calculate duration from metadata (assuming minutes)
            const metaDuration = parseFloat(video.duration) * 60;
            if (!isNaN(metaDuration) && metaDuration > 0) {
                totalDuration = metaDuration;
                requiredWatchTime = totalDuration * 0.5;
            }

            if (!isApiReady) {
                console.warn("API not ready yet, waiting...");
                setTimeout(() => playVideo(index), 500);
                return;
            }

            if (player && typeof player.loadVideoById === 'function') {
                player.loadVideoById(videoId);
            } else {
                player = new YT.Player('ytVideo', {
                    videoId: videoId,
                    playerVars: {
                        'autoplay': 1,
                        'modestbranding': 1,
                        'rel': 0
                    },
                    events: {
                        onReady: onPlayerReady,
                        onStateChange: (event) => {
                            // YT.PlayerState.PLAYING is 1
                            if (event.data === 1) {
                                startWatchTracking();
                            }
                        }
                    }
                });
            }

            document.querySelectorAll(".video-item").forEach((item, i) => {
                item.classList.toggle("active", i === index);
            });
        }

        /* ===============================
           YOUTUBE READY
        ================================= */

        function onPlayerReady() {
            if (maxWatchedTime > 0 && !hasResumed) {
                player.seekTo(maxWatchedTime);
                hasResumed = true;
            }
            startWatchTracking();
        }

        function startWatchTracking() {
            if (totalDuration <= 0) {
                totalDuration = player.getDuration();
                requiredWatchTime = totalDuration * 0.5;
            }

            if (watchInterval) clearInterval(watchInterval);
            if (heartbeatInterval) clearInterval(heartbeatInterval);

            // Real-time local tracking (every 1s)
            watchInterval = setInterval(() => {
                if (!player || typeof player.getCurrentTime !== 'function') return;

                const currentTime = player.getCurrentTime();

                // Anti-cheat: only update max if user is watching naturally
                if (currentTime > maxWatchedTime && currentTime <= maxWatchedTime + 2) {
                    maxWatchedTime = currentTime;
                }

                // If they seek too far ahead of their history, pull them back
                if (currentTime > maxWatchedTime + 5) {
                    player.seekTo(maxWatchedTime);
                }

                const percentage = totalDuration > 0 ? (maxWatchedTime / totalDuration) * 100 : 0;
                console.log(`Watch: ${Math.floor(maxWatchedTime)}s / ${Math.floor(totalDuration)}s (${Math.floor(percentage)}%)`);

                // Local UI unlock if 50% met
                if (percentage >= 50) {
                    const nextBtn = document.getElementById("nextBtn");
                    if (nextBtn && nextBtn.disabled) {
                        nextBtn.disabled = false;
                        console.log("Goal reached! Next button unlocked.");
                    }
                }
            }, 1000);

            // Production-level Heartbeat (every 5s)
            heartbeatInterval = setInterval(async () => {
                if (!player || player.getPlayerState() !== 1) return; // Only if playing

                const percentage = (maxWatchedTime / totalDuration) * 100;

                try {
                    await apiFetch("/progress/update", {
                        method: "POST",
                        body: JSON.stringify({
                            course_id: courseId,
                            video_id: currentIndex,
                            last_watched_time: maxWatchedTime,
                            duration: totalDuration,
                            percentage: percentage
                        })
                    });
                } catch (e) {
                    console.error("Heartbeat failed", e);
                }
            }, 5000);
        }

        async function markComplete() {

            if (courseProgressData.includes(currentIndex)) return;

            courseProgressData.push(currentIndex);

            try {
                await apiFetch("/progress/course/video", {
                    method: "POST",
                    body: JSON.stringify({
                        course_id: courseId,
                        video_index: currentIndex
                    })
                });

                await loadVideos();

            } catch (e) {
                console.log("Save failed");
            }
        }

        /* ===============================
           NAVIGATION
        ================================= */

        let isNavigating = false;
        async function goNext() {
            if (isNavigating) return;
            isNavigating = true;

            try {
                // Save progress when clicking Next
                if (!courseProgressData.includes(currentIndex)) {
                    await markComplete();
                }

                if (currentIndex < videos.length - 1) {
                    playVideo(currentIndex + 1);
                }
            } finally {
                isNavigating = false;
            }
        }

        function goPrev() {
            if (currentIndex > 0) {
                playVideo(currentIndex - 1);
            }
        }

        async function loadNotes() {
            try {
                const user = JSON.parse(localStorage.getItem("user"));
                if (!user) return;
                const data = await apiFetch(`/notes/${user.user_id}/${courseId}`);
                if (data && data.notes !== undefined) {
                    document.getElementById('notesTextarea').value = data.notes;
                }
            } catch (error) {
                console.error('Error loading notes:', error);
            }
        }

        async function saveNotes() {
            const user = JSON.parse(localStorage.getItem("user"));
            if (!user) { alert("Please login to save notes"); return; }
            if (!localStorage.getItem("token")) { window.location.href = "../pages/login.html"; return; }

            const noteContent = document.getElementById('notesTextarea').value;
            const status = document.getElementById('save-status');
            status.textContent = "Saving...";
            try {
                const response = await apiFetch("/notes/save", {
                    method: "POST",
                    body: JSON.stringify({
                        user_id: user.user_id,
                        course_id: courseId,
                        notes: noteContent
                    })
                });
                if (response && (response.status === "saved" || response.status === "updated")) {
                    status.textContent = "Saved!";
                    setTimeout(() => status.textContent = "", 2000);
                } else {
                    status.textContent = "Failed";
                    status.style.color = "red";
                }
            } catch (error) {
                console.error('Error saving notes:', error);
                status.textContent = "Error!";
                status.style.color = "red";
            }
        }

        /* ===============================
           INIT
        ================================= */

        window.onload = async () => {
            await loadVideos();
            playVideo(0);
            loadNotes();
        };
    </script>
</body>

</html>
