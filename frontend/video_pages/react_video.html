<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Course</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            max-width: 1400px;
            margin: 20px auto;
            gap: 20px;
            padding: 0 20px;
        }

        .video-section {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .video-player {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-title {
            font-size: 24px;
            margin: 20px 0 10px 0;
            font-weight: 700;
        }

        .video-info {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .btn-container {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .nav-btn {
            padding: 12px 24px;
            background: #4900c1;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .nav-btn:hover {
            background: #37009b;
        }

        .nav-btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        .playlist-section {
            width: 350px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: fit-content;
        }

        .playlist-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
            color: #111827;
        }

        .video-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .video-item {
            display: flex;
            gap: 12px;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .video-item:hover {
            background: #f9fafb;
        }

        .video-item.active {
            background: #eef2ff;
            border-color: #4900c1;
        }

        .video-thumb {
            width: 120px;
            height: 68px;
            background: #e5e7eb;
            border-radius: 4px;
            object-fit: cover;
        }

        .item-content {
            flex: 1;
            min-width: 0;
            /* for text truncate if needed */
        }

        .item-title {
            font-size: 14px;
            font-weight: 500;
            color: #111827;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-duration {
            color: #6b7280;
            font-size: 12px;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background-color: #f3f4f6;
            color: #4b5563;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .back-home:hover {
            background-color: #e5e7eb;
            color: #1f2937;
        }

        /* --- Responsive Design --- */
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
                padding: 15px;
                margin: 0 auto;
            }

            .playlist-section {
                width: 100%;
                max-height: 400px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            .video-list {
                max-height: 300px;
                /* shorter on mobile */
            }

            .video-section {
                padding: 15px;
            }
        }

        @media (max-width: 768px) {
            .video-title {
                font-size: 20px;
            }

            .btn-container {
                flex-direction: column;
            }
        }
    </style>
    <script src="../js/api.js?v=4"></script>
    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "../pages/login.html";
        }
    </script>
</head>

<body>

    <div class="container">
        <div class="video-section">
            <a href="../pages/dashboard.html" class="back-home">
                ← Back to Dashboard
            </a>
            <div class="video-player">
                <iframe id="ytVideo" width="100%" height="100%" style="display:block;" allowfullscreen></iframe>
            </div>

            <h2 class="video-title" id="videoTitle">Loading...</h2>
            <p class="video-info" id="videoInfo">Duration: --:--</p>

            <div class="btn-container">
                <button class="nav-btn" id="prevBtn" onclick="goPrev()">Previous</button>
                <button class="nav-btn" id="completeBtn" onclick="markComplete()" style="background: #28a745;">Mark
                    Complete</button>
                <button class="nav-btn" id="nextBtn" onclick="goNext()" disabled>Next</button>
            </div>
        </div>

        <div class="playlist-section">
            <div class="playlist-header">Course Videos</div>
            <div class="video-list" id="videoList"></div>
        </div>
    </div>

    <script>
        const videos = [
            { title: "1. React JS Introduction in Tamil", duration: "12:45", thumbnail: "https://img.youtube.com/vi/bMknfKXIFA8/hqdefault.jpg", src: "https://www.youtube.com/embed/bMknfKXIFA8" },
            { title: "2. Setting up React Development Environment", duration: "15:20", thumbnail: "https://img.youtube.com/vi/bMknfKXIFA8/hqdefault.jpg", src: "https://www.youtube.com/embed/bMknfKXIFA8" },
            { title: "3. React Components & Props", duration: "18:30", thumbnail: "https://img.youtube.com/vi/bMknfKXIFA8/hqdefault.jpg", src: "https://www.youtube.com/embed/bMknfKXIFA8" },
            { title: "4. State Management with useState", duration: "20:15", thumbnail: "https://img.youtube.com/vi/bMknfKXIFA8/hqdefault.jpg", src: "https://www.youtube.com/embed/bMknfKXIFA8" },
            { title: "5. Handling Events in React", duration: "14:50", thumbnail: "https://img.youtube.com/vi/bMknfKXIFA8/hqdefault.jpg", src: "https://www.youtube.com/embed/bMknfKXIFA8" },
            { title: "6. Conditional Rendering", duration: "11:30", thumbnail: "https://img.youtube.com/vi/bMknfKXIFA8/hqdefault.jpg", src: "https://www.youtube.com/embed/bMknfKXIFA8" },
            { title: "7. React Hooks - useEffect", duration: "22:40", thumbnail: "https://img.youtube.com/vi/bMknfKXIFA8/hqdefault.jpg", src: "https://www.youtube.com/embed/bMknfKXIFA8" },
            { title: "8. Lists and Keys in React", duration: "16:10", thumbnail: "https://img.youtube.com/vi/bMknfKXIFA8/hqdefault.jpg", src: "https://www.youtube.com/embed/bMknfKXIFA8" },
            { title: "9. Building a Simple Project", duration: "30:00", thumbnail: "https://img.youtube.com/vi/bMknfKXIFA8/hqdefault.jpg", src: "https://www.youtube.com/embed/bMknfKXIFA8" },
            { title: "10. React Router for Navigation", duration: "25:20", thumbnail: "https://img.youtube.com/vi/bMknfKXIFA8/hqdefault.jpg", src: "https://www.youtube.com/embed/bMknfKXIFA8" }
        ];

        let currentIndex = 0;
        const courseId = 'react';
        let courseProgressData = [];

        async function fetchProgress() {
            try {
                const data = await apiFetch("/progress/course");
                return data[courseId] || [];
            } catch (error) {
                console.error('Error fetching progress:', error);
                return [];
            }
        }

        async function loadVideos() {
            const list = document.getElementById('videoList');
            list.innerHTML = '';
            courseProgressData = await fetchProgress();

            videos.forEach((video, index) => {
                const isCompleted = courseProgressData.includes(index);
                const item = document.createElement('div');
                item.className = `video-item ${index === currentIndex ? 'active' : ''}`;

                if (isCompleted || index === 0 || courseProgressData.includes(index - 1)) {
                    item.style.pointerEvents = 'auto';
                    item.style.opacity = '1';
                }

                item.onclick = () => { currentIndex = index; playVideo(index); };
                item.innerHTML = `
                    <img src="${video.thumbnail}" class="video-thumb">
                    <div>
                        <div class="item-title">${video.title} ${isCompleted ? '✅' : ''}</div>
                        <div class="item-duration">${video.duration}</div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function playVideo(index) {
            const video = videos[index];
            const yt = document.getElementById("ytVideo");
            const nextBtn = document.getElementById("nextBtn");
            const completeBtn = document.getElementById("completeBtn");

            const isCompleted = courseProgressData.includes(index);

            completeBtn.disabled = isCompleted;
            completeBtn.textContent = isCompleted ? 'Completed' : 'Mark Complete';
            completeBtn.style.opacity = isCompleted ? '0.7' : '1';

            document.querySelectorAll(".video-item").forEach((item, i) => {
                item.classList.toggle("active", i === index);
            });
            document.getElementById("videoTitle").textContent = video.title;
            document.getElementById("videoInfo").textContent = "Duration: " + video.duration;

            if (yt.dataset.index !== index.toString()) {
                yt.src = video.src + "?enablejsapi=1";
                yt.dataset.index = index;
            }

            nextBtn.disabled = !isCompleted;
        }

        async function markComplete() {
            if (courseProgressData.includes(currentIndex)) return;

            // Optimistic update: Enable Next button instantly
            courseProgressData.push(currentIndex);
            playVideo(currentIndex);

            try {
                await apiFetch("/progress/course/video", {
                    method: "POST",
                    body: JSON.stringify({
                        course_id: courseId,
                        video_index: currentIndex
                    })
                });

                // update sidebar checkmarks and unlock next
                await loadVideos();
            } catch (error) {
                console.error('Error saving progress:', error);
            }
        }

        function goNext() {
            if (currentIndex < videos.length - 1) {
                currentIndex++;
                playVideo(currentIndex);
            }
        }

        function goPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                playVideo(currentIndex);
            }
        }

        window.onload = () => {
            loadVideos();
            playVideo(0);
        };
    </script>
</body>

</html>
