<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | SkillNest</title>
    <link rel="stylesheet" href="../css/signup.css">
    <script src="../js/api.js"></script>
</head>

<body>

    <div class="class">
        <div class="navbar">
            <img class="logo" src="../assests/Gemini_Generated_Image_awja8lawja8lawja-removebg-preview.png">
            <a class="firsta" href="../index.html">Home</a>
            <a href="../index.html#course-a">Courses</a>
            <a href="about.html">About</a>
            <a class="fcall" href="call.html">Schedule Your Free Call</a>
            <a class="Signin" href="login.html">Login</a>
        </div>

        <div class="flex">
            <img src="../assests/A_Man_In_A_Suit_And_Tie_With_His_Arms_Crossed-removebg-preview.png">

            <div class="container">
                <form id="signup-form">

                    <div class="signup">
                        <label>Full Name</label>
                        <input type="text" id="fullName" required>
                    </div>

                    <div class="signup">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="signup">
                        <label>Password</label>
                        <input type="password" id="password" required>
                    </div>

                    <div class="signup">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" required>
                    </div>

                    <div class="signup">
                        <label>Date of birth</label>
                        <input type="date" id="dob" required>
                    </div>

                    <div class="signup">
                        <label>Phone</label>
                        <input type="tel" id="phone" required>
                    </div>

                    <label>Gender</label>
                    <select id="gen">
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>

                    <button type="submit">Submit</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            // ✅ ALWAYS STRING + TRIM (prevents bcrypt crash)
            const password = String(document.getElementById('password').value).trim();
            const confirmPassword = String(document.getElementById('confirmPassword').value).trim();

            if (!password) {
                alert("Password required");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            const userData = {
                user_name: document.getElementById('fullName').value.trim(),
                user_email: document.getElementById('email').value.trim().toLowerCase(),
                user_password: password,
                user_dateofbirth: document.getElementById('dob').value,
                user_phone: document.getElementById('phone').value.trim(),
                user_gender: document.getElementById('gen').value
            };

            const result = await apiFetch("/create_user", {
                method: "POST",
                body: JSON.stringify(userData)
            });

            if (result.status === "success") {
                alert("Signup successful!");
                window.location.href = "login.html";
            } else {
                alert(result.detail || "Signup failed");
            }
        });
    </script>

</body>

</html>
