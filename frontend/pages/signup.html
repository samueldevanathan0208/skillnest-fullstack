<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | SkillNest</title>
    <link rel="stylesheet" href="../css/signup.css">
    <link rel="stylesheet" href="../index.css">
    <script src="../js/api.js?v=4"></script>
</head>

<body>

    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="menu-icon" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <img class="mobile-logo" src="../assests/Gemini_Generated_Image_awja8lawja8lawja-removebg-preview.png"
            alt="logo">
    </header>

    <!-- Sidebar for Mobile -->
    <aside class="sidebar-public" id="sidebar">
        <nav class="sidebar-nav">
            <a href="../index.html">Home</a>
            <a href="../index.html#course-a">Courses</a>
            <a href="about.html">About</a>
            <div class="nav-divider"></div>
            <a href="login.html" class="Signin">Login</a>
        </nav>
    </aside>

    <div class="class">
        <div class="navbar">
            <img class="logo" src="../assests/Gemini_Generated_Image_awja8lawja8lawja-removebg-preview.png">
            <a class="firsta" href="../index.html">Home</a>
            <a href="../index.html#course-a">Courses</a>
            <a href="about.html">About</a>

            <a class="Signin" href="login.html">Login</a>
        </div>

        <div class="flex">
            <img src="../assests/A_Man_In_A_Suit_And_Tie_With_His_Arms_Crossed-removebg-preview.png">

            <div class="container">
                <form id="signup-form">

                    <!-- Full Name -->
                    <div class="signup">
                        <label>Full Name</label>
                        <input type="text" id="fullName" placeholder="Enter your full name (e.g. Samuel Dev)" required>
                    </div>

                    <!-- Email -->
                    <div class="signup">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Enter your email (e.g. samuel@gmail.com)" required>
                    </div>

                    <!-- Password -->
                    <div class="signup">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Create a strong password (min 6 characters)"
                            required>
                    </div>

                    <!-- Confirm Password -->
                    <div class="signup">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
                    </div>

                    <!-- DOB -->
                    <div class="signup">
                        <label>Date of Birth</label>
                        <input type="date" id="dob" required>
                        <small style="color:#666;font-size:12px;">
                            Must be 12+ years old
                        </small>
                    </div>

                    <!-- Phone -->
                    <div class="signup">
                        <label>Phone</label>
                        <input type="tel" id="phone" placeholder="Enter your phone number" required>
                    </div>

                    <!-- Gender -->
                    <label>Gender</label>
                    <select id="gen" required>
                        <option value="">Select gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>

                    <button type="submit">Submit</button>
                </form>
            </div>
        </div>
    </div>


    <script>
        const form = document.getElementById('signup-form');
        const dobInput = document.getElementById("dob");

        /* =========================
           AGE LIMIT (12 YEARS)
           ========================= */

        const today = new Date();

        // block future dates + enforce 12 years old
        const maxDate = new Date(
            today.getFullYear() - 12,
            today.getMonth(),
            today.getDate()
        );

        dobInput.max = maxDate.toISOString().split("T")[0];


        /* =========================
           SUBMIT
           ========================= */

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = String(document.getElementById('password').value).trim();
            const confirmPassword = String(document.getElementById('confirmPassword').value).trim();
            const dobValue = dobInput.value;

            if (!password) {
                alert("Password required");
                return;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            // extra age validation
            const dobDate = new Date(dobValue);
            if (dobDate > maxDate) {
                alert("You must be at least 12 years old to register");
                return;
            }

            const userData = {
                user_name: document.getElementById('fullName').value.trim(),
                user_email: document.getElementById('email').value.trim().toLowerCase(),
                user_password: password,
                user_dateofbirth: dobValue,
                user_phone: document.getElementById('phone').value.trim(),
                user_gender: document.getElementById('gen').value
            };

            try {
                const result = await apiFetch("/create_user", {
                    method: "POST",
                    body: JSON.stringify(userData)
                });

                if (result.status === "success") {
                    alert("Signup successful!");
                    window.location.href = "login.html";
                } else {
                    alert(result.detail || "Signup failed");
                }

            } catch (err) {
                alert("Server error");
                console.error(err);
            }
        });
    </script>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <script>
        const menuToggle_mobile = document.getElementById('menuToggle');
        const sidebar_mobile = document.getElementById('sidebar');
        const overlay_mobile = document.getElementById('overlay');

        function toggleMenuMobile() {
            sidebar_mobile.classList.toggle('active');
            overlay_mobile.classList.toggle('active');
            menuToggle_mobile.classList.toggle('active');
            document.body.style.overflow = sidebar_mobile.classList.contains('active') ? 'hidden' : '';
        }

        menuToggle_mobile.addEventListener('click', toggleMenuMobile);
        overlay_mobile.addEventListener('click', toggleMenuMobile);

        // Close sidebar when clicking a link
        const navLinksMobile = document.querySelectorAll('.sidebar-nav a');
        navLinksMobile.forEach(link => {
            link.addEventListener('click', () => {
                if (sidebar_mobile.classList.contains('active')) {
                    toggleMenuMobile();
                }
            });
        });
    </script>
</body>

</html>
