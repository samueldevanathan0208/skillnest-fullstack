<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillNest | Code Editor</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/modals.css">
    <script src="../js/api.js?v=4"></script>
    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "login.html";
        }
    </script>
    <style>
        :root {
            --primary-color: #4900c1;
            --success-color: #28a745;
            --error-color: #dc3545;
        }

        .editor-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .problem-info {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 2rem;
        }

        .info-content {
            flex: 1;
        }

        .example-box {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 12px;

            min-width: 300px;

        }

        .example-box h4 {
            margin: 0 0 1rem 0;
            color: var(--primary-color);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .example-item {
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
        }

        .example-item:last-child {
            margin-bottom: 0;
        }

        .example-item strong {
            color: #475569;
            display: block;
            margin-bottom: 0.2rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .example-item code {
            background: #e2e8f0;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            display: block;
            color: #1e293b;
        }

        .code-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 1.2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(var(--primary-color-rgb), 0.3);
        }

        .test-case-panel h3 {
            margin: 0 0 1.5rem 0;
            color: var(--primary-color);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .test-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .test-table th {
            text-align: left;
            padding: 0.75rem;
            background: #f1f5f9;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid #e2e8f0;
        }

        .test-table td {
            padding: 1rem 0.75rem;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
            font-family: 'Consolas', monospace;
        }

        .test-table tr:hover {
            background-color: #f8fafc;
        }

        .test-table tr:nth-child(even) {
            background-color: #fbfcfe;
        }

        textarea#code-editor {
            width: 100%;
            height: 500px;
            padding: 1.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 1rem;
            background-color: #1e1e1e;
            color: #d4d4d4;
            outline: none;
            resize: none;
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
        }

        #result-display {
            margin-top: 1.5rem;
            padding: 1.2rem 1.5rem;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .result-passed {
            background: #d4f9e2;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result-failed {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="editor-container">
        <div class="problem-info">
            <div class="info-content">
                <a href="javascript:history.back()"
                    style="color: var(--primary-color); text-decoration: none; font-weight: 600; margin-bottom: 1rem; display: block;">←
                    Back</a>
                <h1 id="p-title" style="margin: 0; font-size: 2.2rem; color: #1e293b;">Loading...</h1>
                <div id="p-description"
                    style="margin-top: 1.2rem; line-height: 1.6; color: #475569; font-size: 1.05rem;"></div>
                <div id="result-display"></div>
            </div>
            <div class="example-box">
                <h4><span>💡</span> Example</h4>
                <div class="example-item">
                    <strong>Input</strong>
                    <code id="p-input">...</code>
                </div>
                <div class="example-item">
                    <strong>Expected Output</strong>
                    <code id="p-output">...</code>
                </div>
            </div>
        </div>
        <div class="code-panel">
            <textarea id="code-editor" spellcheck="false"></textarea>
            <button onclick="submitCode()" id="submit-btn" class="submit-btn">Run & Submit</button>
        </div>
    </div>

    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 1rem; font-weight: 600; color: var(--primary-color);">Running Test Cases...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const problemId = urlParams.get('problem');
        const langId = urlParams.get('lang');

        let currentProblem = null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const problems = await apiFetch(`/problem-solving/${langId}/problems`);
                currentProblem = problems.find(p => p.id == problemId);

                if (currentProblem) {
                    document.getElementById('p-title').innerText = currentProblem.title;
                    document.getElementById('p-description').innerHTML = currentProblem.description;
                    document.getElementById('p-input').innerText = currentProblem.input || "N/A";
                    document.getElementById('p-output').innerText = currentProblem.output || "N/A";

                    const starterData = JSON.parse(currentProblem.starter_code);
                    document.getElementById('code-editor').value = starterData[langId] || "";

                    // Populate Test Case Table
                    const tbody = document.getElementById('test-case-body');
                    const cases = currentProblem.test_cases || [];

                    if (cases.length > 0) {
                        tbody.innerHTML = cases.map(c => `
                            <tr>
                                <td>solve(${Array.isArray(c.input) ? c.input.join(', ') : JSON.stringify(c.input)})</td>
                                <td>${JSON.stringify(c.expected)}</td>
                            </tr>
                        `).join('');
                    } else {
                        tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#94a3b8;">No test cases defined</td></tr>';
                    }
                }
            } catch (error) {
                console.error("Error loading problem:", error);
            }
        });

        async function submitCode() {
            const code = document.getElementById('code-editor').value;
            const overlay = document.getElementById('loading-overlay');
            const resultDisplay = document.getElementById('result-display');

            overlay.style.display = 'flex';
            resultDisplay.style.display = 'none';

            try {
                const user = await apiFetch("/user/me");
                const response = await apiFetch("/problem-solving/submit", {
                    method: 'POST',
                    body: JSON.stringify({
                        user_id: user.user_id,
                        problem_id: problemId,
                        language: langId,
                        code: code
                    })
                });

                resultDisplay.style.display = 'block';
                if (response.status === "Passed" || response.status === "Mocked (Pass)") {
                    resultDisplay.className = "result-passed";
                    resultDisplay.innerHTML = "<strong>✅ Success!</strong> Passed all test cases.";
                } else {
                    resultDisplay.className = "result-failed";
                    resultDisplay.innerHTML = `<strong>❌ Failed!</strong> ${response.error || "Incorrect output."}`;
                }
            } catch (error) {
                console.error("Error submitting code:", error);
            } finally {
                overlay.style.display = 'none';
            }
        }
    </script>
</body>

</html>
