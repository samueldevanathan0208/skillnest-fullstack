<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillNest | Code Editor</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="../js/api.js?v=4"></script>
    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "login.html";
        }
    </script>
    <style>
        :root {
            --primary-color: #4900c1;
            --success-color: #28a745;
            --error-color: #dc3545;
        }

        .editor-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .problem-info {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .code-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        textarea#code-editor {
            width: 100%;
            height: 500px;
            padding: 1.5rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 1rem;
            background-color: #1e1e1e;
            color: #d4d4d4;
            outline: none;
            resize: none;
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
        }

        #result-display {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none;
        }

        .result-passed {
            background: #d4f9e2;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result-failed {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="editor-container">
        <div class="problem-info">
            <a href="javascript:history.back()"
                style="color: var(--primary-color); text-decoration: none; font-weight: 600; margin-bottom: 1rem; display: block;">←
                Back</a>
            <h1 id="p-title">Loading...</h1>
            <div id="p-description" style="margin-top: 1rem; line-height: 1.6;"></div>
        </div>
        <div class="code-panel">
            <textarea id="code-editor" spellcheck="false"></textarea>
            <button onclick="submitCode()" id="submit-btn" class="submit-btn">Run & Submit</button>
            <div id="result-display"></div>
        </div>
    </div>

    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 1rem; font-weight: 600; color: var(--primary-color);">Running Test Cases...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const problemId = urlParams.get('problem');
        const langId = urlParams.get('lang');

        let currentProblem = null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const problems = await apiFetch(`/problem-solving/${langId}/problems`);
                currentProblem = problems.find(p => p.id == problemId);

                if (currentProblem) {
                    document.getElementById('p-title').innerText = currentProblem.title;
                    document.getElementById('p-description').innerHTML = currentProblem.description;

                    const starterData = JSON.parse(currentProblem.starter_code);
                    document.getElementById('code-editor').value = starterData[langId] || "";
                }
            } catch (error) {
                console.error("Error loading problem:", error);
            }
        });

        async function submitCode() {
            const code = document.getElementById('code-editor').value;
            const overlay = document.getElementById('loading-overlay');
            const resultDisplay = document.getElementById('result-display');

            overlay.style.display = 'flex';
            resultDisplay.style.display = 'none';

            try {
                const user = await apiFetch("/user/me");
                const response = await apiFetch("/problem-solving/submit", {
                    method: 'POST',
                    body: JSON.stringify({
                        user_id: user.user_id,
                        problem_id: problemId,
                        language: langId,
                        code: code
                    })
                });

                resultDisplay.style.display = 'block';
                if (response.status === "Passed") {
                    resultDisplay.className = "result-passed";
                    resultDisplay.innerHTML = "<strong>✅ Success!</strong> Passed all test cases.";
                } else {
                    resultDisplay.className = "result-failed";
                    resultDisplay.innerHTML = `<strong>❌ Failed!</strong> ${response.error || "Incorrect output."}`;
                }
            } catch (error) {
                console.error("Error submitting code:", error);
            } finally {
                overlay.style.display = 'none';
            }
        }
    </script>
</body>

</html>
