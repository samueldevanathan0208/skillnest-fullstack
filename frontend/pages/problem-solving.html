<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillNest | Problem Solving</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/modals.css">
    <script src="../js/api.js?v=4"></script>
    <script>
        // if (!localStorage.getItem("token")) {
        //     window.location.href = "login.html";
        // }
    </script>
    <script src="../js/sidebar-handlers.js" defer></script>
    <style>
        :root {
            --primary-color: #4900c1;
            --secondary-color: #ffd700;
            --bg-color: #f8f9fa;
        }

        .main-content {
            padding: 0 !important;
            /* Remove padding to allow header to be full-width */
        }

        .ps-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }

        .header {
            background-color: #4900c1;
            color: #fff;
            padding: 3rem 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: white;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
            color: white;
            margin: 0;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .lang-card {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lang-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(73, 0, 193, 0.1);
        }

        .lang-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
        }

        .lang-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .progress-text {
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="menu-icon" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="header-brand">
            <img src="../assests/Gemini_Generated_Image_awja8lawja8lawja-removebg-preview.png" alt="Logo"
                class="header-logo">
            <span>SkillNest</span>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
        <nav>
            <div class="nav-section">
                <img class="logo" src="../assests/Gemini_Generated_Image_awja8lawja8lawja-removebg-preview.png"
                    alt="Logo">
                <a href="dashboard.html" class="nav-item active">
                    <span>Dashboard</span>
                </a>
                <a href="mylearn.html" class="nav-item">
                    <span>My Learning</span>
                </a>
            </div>

            <div class="nav-section">
                <h3 class="nav-section-title">Learn</h3>
                <a href="learingpath.html" class="nav-item">
                    <span>Learning Path</span>
                </a>
                <a href="quizzes.html" class="nav-item">
                    <span>Quizzes</span>
                </a>
            </div>

            <div class="nav-section">
                <h3 class="nav-section-title">Account Setting</h3>
                <a href="edit.html" class="nav-item">
                    <span>Edit Profile</span>
                </a>
                <a href="#" id="delete-profile-link" class="nav-item">
                    <span>Delete Profile</span>
                </a>
                <a href="#" id="sign-out-link" class="nav-item">
                    <span>Sign Out</span>
                </a>
            </div>
        </nav>
    </aside>

    <div class="main-content">
        <div class="header">
            <h1>Problem Solving</h1>
            <p>Select a language to start practicing your coding skills.</p>
        </div>
        <div class="ps-container">
            <div class="lang-grid" id="lang-grid">
                <!-- Languages will be injected here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log("Fetching languages from /problem-solving/languages");
                const languages = await apiFetch("/problem-solving/languages");
                console.log("Languages received:", languages);

                const grid = document.getElementById('lang-grid');
                if (!languages || languages.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><h3>No languages available.</h3></div>';
                    return;
                }

                const icons = {
                    "python": "🐍",
                    "java": "☕",
                    "javascript": "📜"
                };

                grid.innerHTML = languages.map(lang => `
                    <a href="./ps-list.html?lang=${lang.id}" class="lang-card">
                        <div class="lang-icon">${icons[lang.id.toLowerCase()] || '💻'}</div>
                        <div class="lang-name">${lang.name}</div>
                        <div class="progress-text">Progress: ${lang.solved} / ${lang.total} solved</div>
                    </a>
                `).join('');
            } catch (error) {
                console.error("Error loading languages:", error);
            }
        });
    </script>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            menuToggle.classList.toggle('active');
            document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
        }

        menuToggle.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // Close sidebar when clicking a link (on mobile)
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                if (window.innerWidth <= 768 && sidebar.classList.contains('active')) {
                    toggleMenu();
                }
            });
        });
    </script>
</body>

</html>
