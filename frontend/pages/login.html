<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | SkillNest</title>
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/api-config.js"></script>
</head>

<body>

    <div class="class">
        <div class="navbar">
            <img class="logo" src="../assests/Gemini_Generated_Image_awja8lawja8lawja-removebg-preview.png">
            <a class="firsta" href="../index.html">Home</a>
            <a href="../index.html#course-a">Courses</a>
            <a href="about.html">About</a>
            <a class="fcall" href="call.html">Schedule Your Free Call</a>
            <a class="Signin" href="signup.html">Sign up</a>
        </div>

        <div class="flex">
            <div class="login-container">

                <h1>Login</h1>

                <form id="login-form">

                    <label>Email</label>
                    <input type="email" id="email" required>

                    <label>Password</label>
                    <input type="password" id="password" required>

                    <button type="submit">Login</button>

                </form>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await apiFetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        user_email: email,
                        user_password: password
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    alert(result.detail || "Login failed");
                    return;
                }

                // ✅ Store only the JWT token
                localStorage.setItem("token", result.access_token);

                alert("Login successful!");
                window.location.href = "dashboard.html";

            } catch (err) {
                alert("Server error");
                console.error(err);
            }
        });
    </script>


</body>

</html>
